# Configuration du Worker WIRD (déployé par Cloudflare depuis GitHub, branche claude/wird-v1-pwa-app-xlgy9s, racine = worker/). Aucune valeur secrète ici :
# l'ID D1, l'adresse de l'app et l'e-mail de contact ne sont pas des secrets. Remplace les 3 valeurs « REMPLACER_… ».
name = "wird-push"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "wird-push"
database_id = "e6d279f2-4cd0-41e4-96ce-ddfc464c6149"

[triggers]
# Toutes les 15 minutes : le Worker évalue, pour chaque abonné, quels rappels sont dus dans son fuseau horaire.
crons = ["*/15 * * * *"]

[vars]
ALLOWED_ORIGIN = "https://wird-app-u62.pages.dev"   # origine autorisée (CORS), sans / final
VAPID_SUBJECT = "mailto:gomesj.pro@gmail.com"        # exigé par les services Push (Apple, Google, Mozilla)

# Secrets (jamais dans ce fichier) :
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
