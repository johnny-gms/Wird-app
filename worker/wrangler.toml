# Configuration du Worker WIRD (déployé par Cloudflare depuis GitHub, branche claude/wird-v1-pwa-app-xlgy9s, racine = worker/). Aucune valeur secrète ici :
# l'ID D1 et l'adresse de l'app ne sont pas des secrets. N'y mets jamais ton e-mail personnel.
name = "wird-push"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "wird-push"
database_id = "e6d279f2-4cd0-41e4-96ce-ddfc464c6149"

[triggers]
# Chaque minute : le Worker évalue, pour chaque abonné, quels rappels sont dus dans son fuseau horaire (le rappel part à l'heure choisie, à la minute près).
crons = ["* * * * *"]

[vars]
ALLOWED_ORIGIN = "https://wird-app-u62.pages.dev"   # origine autorisée (CORS), sans / final
VAPID_PUBLIC_KEY = "BIm_xxz1SXHFiCQgiP8xsJAVtCQh6UUgQUJIMEs0OT4YEOBTmqvQpANch5JdjVsh63nlzyc1qExPsyBOz8C3lrc"   # clé PUBLIQUE (pas un secret) : dans ce fichier pour survivre aux redéploiements
VAPID_SUBJECT = "https://wird-app-u62.pages.dev"     # exigé par les services Push (Apple, Google, Mozilla) : une adresse https ou mailto: ; ici l'adresse de l'app, pas d'e-mail personnel

# Secret (jamais dans ce fichier) : seule la clé PRIVÉE. Ne pas recréer VAPID_PUBLIC_KEY comme secret (conflit avec la variable ci-dessus).
#   npx wrangler secret put VAPID_PRIVATE_KEY
