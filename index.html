<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WIRD — Mémorisation du Coran</title>
    <meta name="description" content="WIRD vous aide à entretenir votre mémorisation du Coran, organiser vos révisions et renforcer les versets fragiles." />
    <meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WIRD" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Applique le thème avant le premier rendu (évite le flash).
      try {
        var t = localStorage.getItem('wird-theme');
        var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>WIRD nécessite JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
